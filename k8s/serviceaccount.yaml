# Referenced by the Deployment but missing from the original manifests.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langgraph-execution-sa
  namespace: supply-chain-agents
  annotations:
    # IRSA: least-privilege role for the worker (e.g. MSK IAM auth). Replace the ARN.
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/langgraph-worker-role
automountServiceAccountToken: false
