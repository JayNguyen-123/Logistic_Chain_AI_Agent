apiVersion: external-secrets.io/v1     # v1beta1 is deprecated/removed in current ESO releases
kind: ExternalSecret
metadata:
  name: supply-chain-agent-secrets
  namespace: supply-chain-agents
  labels:
    tier: orchestrator
    app: langgraph-worker
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager-store
    kind: ClusterSecretStore
  target:
    name: langgraph-vault-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: prod/supply-chain/llm-keys, property: openai_key }
    - secretKey: SAP_OAUTH_CLIENT_ID
      remoteRef: { key: prod/supply-chain/sap-gateway, property: client_id }
    - secretKey: SAP_OAUTH_CLIENT_SECRET
      remoteRef: { key: prod/supply-chain/sap-gateway, property: client_secret }
    - secretKey: PAGERDUTY_INTEGRATION_KEY
      remoteRef: { key: prod/supply-chain/pagerduty, property: integration_key }
    - secretKey: CHECKPOINT_DATABASE_URL
      remoteRef: { key: prod/supply-chain/checkpoint-db, property: url }
    - secretKey: KAFKA_SASL_USERNAME
      remoteRef: { key: prod/supply-chain/kafka, property: username }
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef: { key: prod/supply-chain/kafka, property: password }
